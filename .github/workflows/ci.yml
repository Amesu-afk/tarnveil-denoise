name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The only dependency is the onnxruntime runtime, and it is a peer: install it
      # here, or worker.ts types fail to resolve and the check becomes self-deception.
      - run: npm install --no-save onnxruntime-web typescript

      - run: npx tsc --noEmit -p tsconfig.json
